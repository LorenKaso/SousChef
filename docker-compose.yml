version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      SOUSCHEF_DB_PATH: /data/souschef.db
    ports:
      - "8000:8000"
    volumes:
      - souschef_data:/data
    restart: unless-stopped

volumes:
  souschef_data:
